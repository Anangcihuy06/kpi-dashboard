[providers]
python = {}

[phases.setup]
nixPkgs = ["python311", "gcc", "postgresql", "libpq"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate",
  "cd backend && pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "python fix_production_db.py"
]

[start]
cmd = ". /opt/venv/bin/activate && cd backend && python fix_production_db.py && uvicorn main:app --host 0.0.0.0 --port $PORT"
